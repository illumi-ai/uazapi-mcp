[project]
name = "uazapi-mcp"
dynamic = ["version"]
description = "MCP server para ler, transcrever e enviar mensagens de WhatsApp via uazapi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "whatsapp", "uazapi", "claude", "model-context-protocol"]
authors = [{ name = "illumi" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "certifi",
]

[project.urls]
Homepage = "https://github.com/illumi-ai/uazapi-mcp"
Issues = "https://github.com/illumi-ai/uazapi-mcp/issues"
Changelog = "https://github.com/illumi-ai/uazapi-mcp/blob/main/CHANGELOG.md"
Releases = "https://github.com/illumi-ai/uazapi-mcp/releases"

[project.scripts]
uazapi-mcp = "uazapi_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/uazapi_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uazapi_mcp"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = ["E501", "S101"]
